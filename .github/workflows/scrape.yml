name: Kariyer Kapisi AI Scraper

on:
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/jobs.json
          git diff --cached --quiet || (git commit -m "🔄 İlanlar güncellendi ($(date +'%Y-%m-%d %H:%M'))" && git push)
