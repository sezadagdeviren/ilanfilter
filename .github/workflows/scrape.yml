name: Kariyer Kapisi AI Scraper

on:
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write  # Repo'ya yazma (push) izni

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Maksimum 45 dakika, sonra zorla durdur
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 PyPDF2

      - name: Debug API Key Format
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          python3 -c "
          import os, requests
          keys_env = os.environ.get('GEMINI_API_KEYS', '')
          keys = [k.strip() for k in keys_env.split(',')]
          print(f'Key sayisi: {len(keys)}')
          key = keys[0] if keys else ''
          print(f'Key uzunlugu: {len(key)}')
          print(f'Key baslangic: {repr(key[:6])}')
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={key}'
          r = requests.post(url, json={'contents': [{'parts': [{'text': 'test'}]}]}, timeout=10)
          print(f'API Test: HTTP {r.status_code}')
          if r.status_code != 200:
              print(r.text[:300])
          "

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/jobs.json public/ai_logs.json
          git diff --cached --quiet || git commit -m "🔄 İlanlar güncellendi ($(date +'%Y-%m-%d %H:%M'))"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
